<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Services - Hero Section</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar Section (Using inline-block, no Flexbox) -->
    <header class="navbar">
        <div class="logo">LaundryWallah</div>
        <nav class="nav-links">
            <a href="#home">Home</a>
            <a href="#services">Services</a>
            <a href="#about">About Us</a>
            <a href="#contact">Contact Us</a>
        </nav>
        <div class="user-name">Priyanka</div>
    </header>

    <!-- Hero Section with Two Divs -->
    <section class="hero-section">
        <!-- Left Div: Heading, Description, and Button -->
        <div class="hero-left">
            <h1>Professional Laundry Services at Your Doorstep</h1>
            <p>Experience hassle-free laundry care. We wash, fold, and dry-clean your clothes with utmost care so you can focus on what matters most.</p>
            <button class="hero-btn">Book a Service Today</button>
        </div>

        <!-- Right Div: Laundry Image -->
        <div class="hero-right">
            <img src="https://images.unsplash.com/photo-1517677208171-0bc6725a3e60?auto=format&fit=crop&w=600&q=80" alt="Laundry Services">
        </div>
    </section>

</body>
</html>
